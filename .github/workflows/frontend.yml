name: Deploy Node.js App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.IP }}
          username: karan
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            cd /home/karan/frontseedly

            git pull origin main

             npm install

            npm run build || true

            sudo npm i pm2 -g
            sudo npm i http-server -g 
            cd /home/karan/frontseedly/dist

            pm2 restart app || pm2 start http-server --name frontend -- -p 4200 -d false 
